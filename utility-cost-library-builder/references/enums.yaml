schema_version: 3.2.1
last_reviewed: 2026-05-28
authority: "skill canonical — closed world; no values added without explicit user approval. Enums grouped by dimension; comments anchor each section."

# ============================================================
# UTILITY DOMAIN (v3 = electric only; codes match UtilixV2.tblDomain)
# ============================================================
utility_domain:
  - ELEC  # Electric — matches tblDomain.DomainCode
  - GAS   # Gas — matches tblDomain.DomainCode (reserved, not active in v3)
  # v4 candidates (NOT active in v3; refuse with OUT_OF_SCOPE):
  # WATER, TELECOM, CIVIL_COMMON

# ============================================================
# WBS-A LEVEL CODES — Electric T&D 7-level hierarchy
# Dot-path: <L1>.<L2>.<L3>.<L4>.<L5>.<L6>.<L7>
# Example: E.T.S.P04.CON.BGR.FDN
# ============================================================
wbs_l1_electric:
  - E   # Electric (root) — not instantiated in DB; implied by tblDomain.ELEC

wbs_l2_electric:
  # L2 = Functional Area (FNAR)
  - T   # Transmission (≥69 kV)
  - D   # Distribution (<69 kV)

wbs_l3_electric:
  # L3 = Facility Type (FCTY)
  - S   # Substation
  - L   # Line (overhead and underground)

wbs_l4_electric:
  # L4 = Phase (PHSE) — cost-to-schedule integration point
  # Phases provide the time dimension for P6 schedule loading
  - P00   # Planning — early scope definition, siting studies, environmental baseline
  - P01   # Development — land acquisition, permit applications, 30% design
  - P02   # Engineering — detailed design (60%, 90%, IFC)
  - P03   # Pre-Construction — procurement, permit approvals, mobilization prep
  - P04   # Project Execution — field work, construction, commissioning
  - P05   # Closeout — as-builts, warranty, final documentation
  # NOTE: CON is a Discipline (L5), not a Phase (L4).
  # P04 (Project Execution) is the phase that contains CON and other field disciplines.

wbs_l5_electric:
  # L5 = Discipline (DISC) — functional group active during a phase
  # Multiple disciplines operate within each phase.
  #
  # --- P04 (Project Execution) phase disciplines ---
  - CON   # Construction — physical asset installation crews
  #
  # --- Other phase disciplines (to be enumerated) ---
  # P00 disciplines: planning studies, environmental baseline
  # P01 disciplines: land acquisition, permit applications
  # P02 disciplines: design teams by specialty
  # P03 disciplines: procurement, mobilization
  # P05 disciplines: documentation, warranty

wbs_l6_electric:
  # L6 = Deliverable Category (DLVR) — category of output for a discipline
  # Under CON discipline: physical asset categories
  # Under other disciplines: project deliverable categories
  #
  # --- CON discipline deliverable categories (physical assets) ---
  - BGR   # Below Grade — structural foundations / grounding only (NOT underground utility)
  - UGD   # Underground — UG utility infrastructure (cables, conduit, manholes, etc.)
  - OVH   # Overhead — line structures (L only)
  - WIR   # Wire — overhead conductors (L only)
  - SCT   # Sectionalizing — switches/reclosers on conductors (L only)
  - FIB   # Fiber / Comms
  - GCO   # General Conditions — project-wide indirects (mob, traffic, security, etc.)
  - MEQ   # Major Equipment — transformers, breakers, switches (S; D.L only)
  - STC   # Site Conditions — physical site factors (L T and D only)
  - BUS   # Buswork (S only)
  - CAB   # Control / LV Cable (S only)
  - CHS   # Control House (S only)
  - PRO   # Protection & Control (S only)
  - SEC   # Security — permanent infrastructure (S only)
  - SSV   # Station Service (S only)
  - STR   # Above-Grade Structures (S only)
  - SWK   # Sitework / Yard Prep (S only)
  #
  # --- TEN discipline deliverable categories (engineering outputs) ---
  - D10   # 10% Design / Follow-Up
  - D30   # 30% Design
  # TODO: Complete non-CON deliverable categories

wbs_l7_electric:
  # L6 codes — partial enumeration; per (branch, L5) the exact valid set
  # is constrained by examples.yaml and source_catalog. Add new codes via
  # explicit user approval; do not invent.

  # --- BGR (foundations/grounding) ---
  - FDN  # Foundation (drilled pier, spread footing, direct embed)
  - ANC  # Anchor — guy anchors, screw anchors, deadman
  - DEM  # Direct Embed (pole buried in earth, no concrete)
  - MAT  # Mat Foundation (large slab foundation)
  - PAD  # Equipment Pad (concrete pad for transformer/breaker)
  - GGD  # Ground Grid (buried copper grid)
  - GRR  # Ground Rods (driven copper rods) — renamed from GRD to avoid collision
  - OCT  # Oil Containment (concrete vault under oil-filled transformers)

  # --- UGD (underground utility) ---
  - CBL  # Underground Power Cable
  - CDT  # Conduit (empty raceway)
  - DBR  # Direct Buried (cable laid in earth, no conduit)
  - HHD  # Handhole (small underground pull box)
  - MNH  # Manhole (large underground vault)
  - RSR  # Riser (UG-to-AG transition conduit)
  - TRM  # UG Termination (cable end-point / pothead)
  - TRN  # Cable Trench (open cable trough)

  # --- OVH (overhead structures) ---
  - POL  # Pole
  - TWR  # Tower
  - GUY  # Guying
  - GND  # Grounding (overhead conductor system)
  - INS  # Insulators
  - PRD  # Protective Devices
  - ATT  # Attachments

  # --- WIR (overhead conductors) ---
  - CND  # Conductor
  - SHW  # Shield Wire / OHSW / OHGW (canonical term: Shield Wire per A_RULE_06)
  - JMP  # Jumper — loop conductors at structures
  - DMP  # Damper — vibration dampers, spacer dampers
  - ARM  # Armor Rod — conductor protection at clamps
  - SPC  # Spacer — bundle spacers for multi-conductor
  - SPL  # Splice — conductor splices and compression joints
  - WGT  # Weights — conductor weights for uplift conditions

  # --- SCT (sectionalizing) ---
  - SWT  # Switch — disconnect switch, air break switch
  - RCL  # Recloser — automatic circuit recloser
  - FUS  # Fuse — fuse cutout, power fuse
  - SRA  # Surge Arrester — line arresters, TLSA

  # --- FIB (fiber/comms) ---
  - OPG  # OPGW — optical ground wire
  - ADS  # ADSS — all-dielectric self-supporting fiber
  - ENC  # Splice Enclosure — fiber splice cases
  - PCH  # Patch Panel — fiber termination panels
  - TRM  # Termination — fiber terminations (shared with UGD)
  - SPL  # Splice — fiber splices (shared with UGD)
  - CMC  # Comms Cabinet — renamed from CAB to avoid L5 collision

  # --- GCO (indirect, project-wide) ---
  - MOB  # Mobilization / Demobilization
  - TCO  # Traffic Control
  - ESC  # E&S Controls
  - SVY  # Survey & Staking
  - CLR  # Clearing (vegetation/tree removal; L only) — per ADR-09
  - ACC  # Access (temp haul roads)
  - ROC  # Rock / Rock Mitigation
  - TMP  # Temp Security — construction site security
  - GWT  # Groundwater / Dewatering
  - RCL  # Reclamation (post-construction site restoration; S only) — per ADR-09

  # --- MEQ ---
  - BRK  # Circuit Breaker
  - CAP  # Capacitor Bank
  - CTX  # Current Transformer — metering and protection CTs
  - GOS  # Ground Switch — grounding switches
  - PTX  # Voltage Transformer — metering and protection VTs (canonical: VT not PT per A_RULE_06)
  - REA  # Reactor — shunt reactors
  - REG  # Regulator — voltage regulators
  - SRA  # Surge Arrester (NOT "Arrestor" per A_RULE_06)
  - SWT  # Switch — disconnect / air break switch
  - TRF  # Transformer — power transformer (S) / line transformer (D.L)

  # --- STC (Site Conditions — L T & D only) ---
  - UTC  # Existing Utility Conflict
  - PAV  # Pavement Restoration
  - SRF  # Surface Restoration
  - GRD  # Grading

  # --- BUS (Buswork — S only) ---
  - RIG  # Rigid Bus — tubular aluminum bus
  - FLX  # Flexible Bus — strain bus, slack spans
  - STB  # Bus Support — bus insulators and supports
  - BCN  # Bus Connection — bus taps, connections, hardware
  # JMP and INS are shared with WIR/OVH — same-code-same-node; valid in BUS context

  # --- CAB (Control / LV Cable — S only) ---
  - CTL  # Control Cable — control and signal cables
  - LVC  # LV Power Cable — low voltage power cables
  - TRY  # Cable Tray — cable tray and raceway
  - LBL  # Labels — cable labels and tagging
  # GND and TRM shared with OVH/UGD/FIB — same-code-same-node; valid in CAB context

  # --- CHS (Control House — S only) ---
  - BAT  # Station Battery
  - CHG  # Battery Charger
  - FIR  # Fire Protection / Detection
  - HVC  # HVAC
  - LIT  # Interior Lighting / Yard Lighting
  - SHL  # Building Shell
  - UPS  # UPS / DC System

  # --- PRO (Protection & Control — S only) ---
  - ANN  # Annunciator
  - H2D  # Hydrogen Detection
  - HMI  # HMI / Local Panel
  - MTR  # Revenue Metering
  - REL  # Protective Relays
  - SCD  # SCADA / RTU
  - SYN  # Synchronizer
  - WEA  # Weather Station
  - PWR  # Internal Panel Wiring — renamed from WIR to avoid L5 collision

  # --- SEC (Permanent Security — S only L5) ---
  - ACT  # Access Control — renamed from ACS to avoid SCT.ACS collision
  - ALM  # Intrusion Alarm
  - CCT  # CCTV
  - FNC  # Perimeter Fence
  - GAT  # Gates
  - SGN  # Signage

  # --- SSV (Station Service — S only) ---
  - ATS  # Auto Transfer Switch
  - GEN  # Generator
  - LSW  # Light Switches / Receptacles
  - PAN  # AC Panels
  - SST  # Station Service Transformer
  - SSW  # Safety Switch

  # --- STR (Above-Grade Structures — S only) ---
  - BSP  # Bus Support Structure — renamed from BUS to avoid L5 collision
  - DED  # Deadend Structure
  - EQS  # Equipment Support — equipment support structures
  - GAN  # Gantry
  - LMA  # Lightning / Static Mast
  - PNT  # Paint / Coating

  # --- SWK (Sitework — S only) ---
  - CVT  # Culvert
  - DRN  # Stormwater Drainage
  - EXC  # Mass Excavation
  - FIL  # Structural / Engineered Fill
  - RDX  # Road Crossing / Entrance
  - SUR  # Crushed-Stone Yard Surfacing
  # GRD listed under STC above
  # PAV listed under STC above
  # UTC listed under STC above

  # --- ACQ.LND / ACQ.ROW (tangibles) ---
  - FEE  # Purchase / Easement Fees (per EPI 7)
  # NOTE: ACQ branch reuses higher-level codes via path context, not via
  # unique L6 codes. E.g., ACQ.PER.PRM uses PRM (Permit) as L6;
  # ACQ.ENV.APP uses APP (Application Fee) as L6.

  # --- ACQ.PER.* (Permitting tangibles) ---
  - PRM  # Permit Fees
  - APP  # Application Fees (NEPA, CPCN, environmental, siting)

  # --- ACQ.ENV.* / ACQ.SIT.* ---
  - RPT  # Studies & Reports (third-party deliverables)

