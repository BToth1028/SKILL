# ============================================================
# IEEE/ANSI TERMINOLOGY LOCK (A_RULE_06)
# Maps non-canonical input variants → canonical form.
# ============================================================
canonical_terminology:
  Arrestor: Surge Arrester
  Arrester: Surge Arrester
  Air Switch: Disconnect Switch
  PT: VT
  Potential Transformer: Voltage Transformer
  OHGW: Shield Wire
  Overhead Ground Wire: Shield Wire
  Static Wire: Shield Wire

