schema_version: 4.0.0
last_reviewed: 2026-05-14
authority: "skill canonical — closed world; no values added without explicit user approval. Enums grouped by dimension; comments anchor each section."

# ============================================================
# UTILITY DOMAIN (v4 activates GAS per ADR-16)
# Authority: 18 CFR Part 101 (Electric) + 18 CFR Part 201 (Natural Gas)
# ============================================================
utility_domain:
  - ELECTRIC
  - GAS_TRANSMISSION         # NEW v4 — Part 201 transmission scope
  - GAS_DISTRIBUTION         # NEW v4 — Part 201 distribution scope
  - UNKNOWN
  # v5 candidates (NOT active in v4; refuse with OUT_OF_SCOPE):
  # WATER_DISTRIBUTION, WATER_TRANSMISSION, TELECOM_OSP, CIVIL_COMMON

# ============================================================
# WBS-A LEVEL CODES — Electric T&D physical assets + ACQ soft costs
# Dot-path: <L1>.<L2>.<L3>.<L4>.<L5>.<L6>
# Example: E.T.SUB.CON.BGR.FDN
# ============================================================
wbs_l1_electric:
  - E   # Electric (root)

wbs_l2_electric:
  - T   # Transmission (≥69 kV)
  - D   # Distribution (<69 kV)

wbs_l3_electric:
  - SUB # Substation
  - LIN # Line (overhead and underground)

wbs_l4_electric:
  - CON # Construction (direct asset-producing physical work)
  - ACQ # Acquisitions / Project Soft Costs (NEW in v3 — replaces PDL)
  # DEPRECATED in v3:
  # PDL — Project Delivery (split into WBS-B for labor + ACQ for tangibles per ADR-12)

wbs_l5_electric:
  # CON.* L5 family codes
  - BGR   # Below Grade — structural foundations / grounding only (NOT underground utility)
  - UGD   # Underground — UG utility infrastructure (cables, conduit, manholes, etc.)
  - OVH   # Overhead — line structures (LIN only)
  - WIR   # Wire — overhead conductors (LIN only)
  - SCT   # Sectionalizing — switches/reclosers on conductors (LIN only)
  - FIB   # Fiber / Comms
  - GCO   # General Conditions — project-wide indirects (mob, traffic, security, etc.)
  - MEQ   # Major Equipment — transformers, breakers, switches (SUB; D-LIN only)
  - STC   # Site Conditions — physical site factors (LIN T and D only)
  - BUS   # Buswork (SUB only)
  - CAB   # Control / LV Cable (SUB only)
  - CHS   # Control House (SUB only)
  - PRO   # Protection & Control (SUB only)
  - SEC   # Security — permanent infrastructure (SUB only)
  - SSV   # Station Service (SUB only)
  - STR   # Above-Grade Structures (SUB only)
  - SWK   # Sitework / Yard Prep (SUB only)
  # ACQ.* L5 family codes (NEW in v3)
  - LND   # Land (SUB.ACQ only)
  - ROW   # Right of Way (LIN.ACQ only)
  - PER   # Permitting (ACQ branch)
  - ENV   # Environmental (ACQ branch)
  - SIT   # Siting (ACQ branch)
  - ICN   # Interconnection Fees (ACQ branch)
  - TST   # Testing — 3rd-party (ACQ branch)
  # NOTE: PER/ENV/SIT were previously L5 family codes under PDL (labor pools).
  # In v3 those labor pools moved to WBS-B (LBR.IND.*). The L5 codes are
  # repurposed for tangible ACQ items (permit fees, environmental application
  # fees, siting application fees). Context disambiguation: L4 = ACQ → tangibles;
  # L2 = LBR (WBS-B) → labor pools.

wbs_l6_electric:
  # L6 codes — partial enumeration; per (branch, L5) the exact valid set
  # is constrained by examples.yaml and source_catalog. Add new codes via
  # explicit user approval; do not invent.

  # --- BGR (foundations/grounding) ---
  - FDN  # Foundation (drilled pier, spread footing — general structure foundation)
  - DEM  # Direct Embed (pole buried in earth, no concrete)
  - MAT  # Mat Foundation (large slab foundation)
  - PAD  # Equipment Pad (concrete pad for transformer/breaker)
  - GGD  # Ground Grid (buried copper grid)
  - GRR  # Ground Rods (driven copper rods) — renamed from GRD to avoid collision
  - OCT  # Oil Containment (concrete vault under oil-filled transformers)

  # --- UGD (underground utility) ---
  - CBL  # Underground Power Cable
  - CDT  # Conduit (empty raceway)
  - DBR  # Direct Buried (cable laid in earth, no conduit)
  - HHD  # Handhole (small underground pull box)
  - MNH  # Manhole (large underground vault)
  - RSR  # Riser (UG-to-AG transition conduit)
  - TRM  # UG Termination (cable end-point / pothead)
  - TRN  # Cable Trench (open cable trough)

  # --- OVH (overhead structures) ---
  - POL  # Pole
  - TWR  # Tower
  - GUY  # Guying
  - GND  # Grounding (overhead conductor system)
  - INS  # Insulators
  - PRD  # Protective Devices
  - ATT  # Attachments

  # --- WIR (overhead conductors) ---
  - CND  # Conductor
  - OHG  # OHGW / Shield Wire / OHSW (canonical term: Shield Wire per A_RULE_06)

  # --- SCT (sectionalizing) ---
  - DSC  # Disconnect Switch
  - REC  # Recloser
  - ACS  # Accessories
  - VTX  # Voltage Transformer (VT) — formerly PT (per IEEE C57.13, A_RULE_06)

  # --- FIB ---
  - OPG  # OPGW
  - ADS  # ADSS
  - SPL  # Fiber Splice
  - ENC  # Splice Enclosure
  - PCH  # Patch Panel
  - CMC  # Comms Cabinet — renamed from CAB to avoid L5 collision

  # --- GCO (indirect, project-wide) ---
  - ACC  # Access (temp haul roads)
  - ESC  # E&S Controls
  - GWT  # Groundwater / Dewatering
  - MOB  # Mobilization / Demobilization
  - RCL  # Reclamation (post-construction site restoration; SUB only) — per ADR-09
  - CLR  # Clearing (vegetation/tree removal; LIN only) — per ADR-09
  - ROC  # Rock / Rock Mitigation
  - SCS  # Temp Construction Security — renamed from SEC to avoid L5 collision
  - SVY  # Survey & Staking
  - TCO  # Traffic Control

  # --- MEQ ---
  - BRK  # Circuit Breaker
  - CAP  # Capacitor Bank
  - CTX  # Current Transformer
  - GOS  # Grounding Switch
  - REA  # Reactor
  - REG  # Voltage Regulator
  - SRA  # Surge Arrester (NOT "Arrestor" per A_RULE_06)
  - SWT  # Disconnect / Air Switch
  - TRF  # Power Transformer (SUB) / Line Transformer (D-LIN)

  # --- STC (Site Conditions — LIN T & D only) ---
  - UTC  # Existing Utility Conflict
  - PAV  # Pavement Restoration
  - SRF  # Surface Restoration
  - GRD  # Grading

  # --- CHS (Control House — SUB only) ---
  - BAT  # Station Battery
  - CHG  # Battery Charger
  - FIR  # Fire Protection / Detection
  - HVC  # HVAC
  - LIT  # Interior Lighting / Yard Lighting
  - SHL  # Building Shell
  - UPS  # UPS / DC System

  # --- PRO (Protection & Control — SUB only) ---
  - ANN  # Annunciator
  - H2D  # Hydrogen Detection
  - HMI  # HMI / Local Panel
  - MTR  # Revenue Metering
  - REL  # Protective Relays
  - SCD  # SCADA / RTU
  - SYN  # Synchronizer
  - WEA  # Weather Station
  - PWR  # Internal Panel Wiring — renamed from WIR to avoid L5 collision

  # --- SEC (Permanent Security — SUB only L5) ---
  - ACT  # Access Control — renamed from ACS to avoid SCT.ACS collision
  - ALM  # Intrusion Alarm
  - CCT  # CCTV
  - FNC  # Perimeter Fence
  - GAT  # Gates
  - SGN  # Signage

  # --- SSV (Station Service — SUB only) ---
  - ATS  # Auto Transfer Switch
  - GEN  # Generator
  - LSW  # Light Switches / Receptacles
  - PAN  # AC Panels
  - SST  # Station Service Transformer
  - SSW  # Safety Switch

  # --- STR (Above-Grade Structures — SUB only) ---
  - BSP  # Bus Support Structure — renamed from BUS to avoid L5 collision
  - DED  # Deadend Structure
  - EQP  # Equipment Support Structure
  - GAN  # Gantry
  - LMA  # Lightning / Static Mast
  - PNT  # Paint / Coating

  # --- SWK (Sitework — SUB only) ---
  - CVT  # Culvert
  - DRN  # Stormwater Drainage
  - EXC  # Mass Excavation
  - FIL  # Structural / Engineered Fill
  - RDX  # Road Crossing / Entrance
  - SUR  # Crushed-Stone Yard Surfacing
  # GRD listed under STC above
  # PAV listed under STC above
  # UTC listed under STC above

  # --- ACQ.LND / ACQ.ROW (tangibles) ---
  - FEE  # Purchase / Easement Fees (per EPI 7)
  # NOTE: ACQ branch reuses higher-level codes via path context, not via
  # unique L6 codes. E.g., ACQ.PER.PRM uses PRM (Permit) as L6;
  # ACQ.ENV.APP uses APP (Application Fee) as L6.

  # --- ACQ.PER.* (Permitting tangibles) ---
  - PRM  # Permit Fees
  - APP  # Application Fees (NEPA, CPCN, environmental, siting)

  # --- ACQ.ENV.* / ACQ.SIT.* ---
  - RPT  # Studies & Reports (third-party deliverables)

# ============================================================
# WBS-B LEVEL CODES — Labor (NEW in v3 — no FERC tags)
# Dot-path: <L1>.<L2>.<L3>
# Example: LBR.DIR.ELE, LBR.IND.ENG
# ============================================================
wbs_b_l1:
  - LBR   # Labor root (no T/D distinction)

wbs_b_l2:
  - DIR   # Direct Labor
  - IND   # Indirect Labor

wbs_b_l3_direct:
  - CIV   # Civil
  - ELE   # Electrical
  - MEC   # Mechanical
  - SVY   # Survey
  - OPE   # Equipment Operations

wbs_b_l3_indirect:
  - ENG   # Engineering
  - PMG   # Project Management
  - CMG   # Construction Management
  - ENV   # Environmental
  - PER   # Permitting
  - SIT   # Siting
  - COM   # Commissioning
  - QAQ   # QA / QC
  - SAF   # Safety
  - LRA   # Land / ROW Administration

# ============================================================
# FERC USoA — closed-world account lists (Part 101 + Part 201)
# Disjoint by code-Part affiliation. Account 365 means different things
# in Part 101 vs Part 201 — every WBS_FERC_Linkage row carries a
# ferc_part tag. Authority: 18 CFR Parts 101/201 (eCFR last amended
# 2026-02-19); Order No. 898 effective 2025-01-01 added 351, 363
# (storage), 158 (environmental credits), and computer/comms sub-accounts
# under 391/397 — see source_catalog.yaml.
# Full descriptions live in FERC_Accounts workbook tab.
# ============================================================
ferc_account_part_101:
  # Preliminary / Intangible
  - "183"  # Preliminary Survey and Investigation Charges
  - "301"  # Organization
  - "302"  # Franchises and Consents
  - "303"  # Miscellaneous Intangible Plant
  # Transmission Plant (T)
  - "350"  # Land and Land Rights
  - "351"  # Energy Storage Equipment — Transmission (NEW per Order 898, eff 2025-01-01)
  - "352"  # Structures and Improvements
  - "353"  # Station Equipment
  - "354"  # Towers and Fixtures
  - "355"  # Poles and Fixtures
  - "356"  # Overhead Conductors and Devices
  - "357"  # Underground Conduit
  - "358"  # Underground Conductors and Devices
  - "359"  # Roads and Trails
  - "359.1" # Asset Retirement Costs for Transmission Plant (ADDED v4)
  # Distribution Plant (D)
  - "360"  # Land and Land Rights
  - "361"  # Structures and Improvements
  - "362"  # Station Equipment
  - "363"  # Energy Storage Equipment — Distribution (relabeled per Order 898; pre-898 name was "Storage Battery Equipment")
  - "364"  # Poles, Towers and Fixtures
  - "365"  # Overhead Conductors and Devices
  - "366"  # Underground Conduit
  - "367"  # Underground Conductors and Devices
  - "368"  # Line Transformers
  - "369"  # Services
  - "370"  # Meters
  - "371"  # Installations on Customer Premises
  - "372"  # Leased Property on Customer Premises (ADDED v4)
  - "373"  # Street Lighting and Signal Systems
  - "374"  # Asset Retirement Costs for Distribution Plant
  # Balance Sheet — Environmental Credits (NEW per Order 898)
  - "158.1" # Allowance Inventory
  - "158.2" # Allowances Withheld
  - "158.3" # Environmental Credits — Renewable Energy (formerly REC accounting)
  - "158.4" # Environmental Credits — Carbon / Emissions
  - "UNKNOWN"

# v3 alias — DEPRECATED in v4. Use ferc_account_part_101.
# Removed in v5. Kept here so legacy refs don't immediately break.
ferc_account_electric:
  - "see_ferc_account_part_101_DEPRECATED_v4"

