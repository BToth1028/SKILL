# NEW v4 — code-Part affiliation tag per ADR-16.
# Every WBS_FERC_Linkage row MUST carry exactly one ferc_part value.
ferc_part:
  - PART_101                 # 18 CFR Part 101 (Electric Public Utilities, Federal Power Act)
  - PART_201                 # 18 CFR Part 201 (Natural Gas Companies, Natural Gas Act)
  - UNKNOWN

ferc_account_class:
  - INVESTIGATION              # 183 (Part 101 only)
  - INTANGIBLE                 # 301, 302, 303 (both Parts)
  - TRANSMISSION_ELECTRIC      # Part 101: 350-359.1
  - DISTRIBUTION_ELECTRIC      # Part 101: 360-374
  - PRODUCTION_GATHERING_GAS   # Part 201: 304-320 (NEW v4)
  - PRODUCTS_EXTRACTION_GAS    # Part 201: 340-347 (NEW v4)
  - UNDERGROUND_STORAGE_GAS    # Part 201: 350-356 (NEW v4)
  - OTHER_STORAGE_GAS          # Part 201: 360-363.5 (NEW v4)
  - LNG_TERMINALING_GAS        # Part 201: 364.1-364.8 (NEW v4)
  - TRANSMISSION_GAS           # Part 201: 365-371 (NEW v4)
  - DISTRIBUTION_GAS           # Part 201: 374-387 (NEW v4)
  - GENERAL_PLANT              # 389-399 (both Parts)
  - ENVIRONMENTAL_CREDITS      # 158.1-158.4 (NEW v4 per Order 898)

ferc_branch_applicability:
  - T_ONLY                     # T contexts (Part 101: 350, 352-359.1; Part 201: 365-371)
  - D_ONLY                     # D contexts (Part 101: 360-374; Part 201: 374-387)
  - BOTH                       # Both T and D (Part 101: 183)
  - INTANGIBLE_ONLY            # 301, 302, 303 (both Parts)
  - PRODUCTION_ONLY            # Part 201 production (304-320) — NEW v4
  - STORAGE_ONLY               # Part 201 storage (350-356, 360-363.5, 364.1-364.8) — NEW v4
  - GENERAL_ONLY               # General Plant (389-399, both Parts)
  - ENVIRONMENTAL_ONLY         # 158 series Environmental Credits — NEW v4 per Order 898

ferc_account_basis:
  # How does a row's FERC get determined? Used in Permits.ferc_account_basis.
  - SPECIFIC_ACCOUNT             # Always routes to one specific account
  - INHERITS_FROM_ENABLED_ASSET  # Inherits FERC from the WBS-A asset it attaches to at CU layer
  - ACCOUNT_183_TRANSFERS        # Pre-commitment in 183; transfers to plant account on commit (per EPI 3(20))
  - FERC_303_INTANGIBLE          # Only for genuinely intangible items (patents, franchises, licenses)
  - INHERITS_FROM_STATE_OVERLAY  # NEW v4 — routing modified by state overlay (e.g., NY PSC RDM/EAM/REV deferred-asset)

# ============================================================
# PERMIT TAXONOMY (NEW in v3)
# ============================================================
permit_bucket:
  - A1_FEDERAL              # Federal, project-wide
  - A2_STATE                # State-level, project-wide per state
  - A3_LOCAL                # Local/municipal, project-wide per jurisdiction
  - A4_ASSET_CROSSING       # Asset / crossing / site-specific (per instance)
  - A5_ACTIVITY             # Activity-specific (per construction method/event)

permit_scope:
  - PROJECT                 # Whole project (A1, A2, A3)
  - CORRIDOR                # Linear corridor section
  - PER_CROSSING            # Per individual crossing instance
  - PER_SITE                # Per individual site (substation, structure)
  - PER_EVENT               # Per construction event (blast, lift, etc.)

permit_cost_treatment:
  - CAPITALIZED             # Capitalized to plant via WBS_FERC_Linkage
  - EXPENSED                # O&M expense (e.g., post-in-service operating permits)
  - MIXED                   # Some capitalized, some expensed

# ============================================================
# JOIN-TAB COMMON ENUMS (NEW in v3)
# ============================================================
granularity:
  - L5_WILDCARD             # Applies to all L6 children of the L5
  - L6_SPECIFIC             # Explicit L6 entry; overrides L5 wildcard

applicability:
  - PRIMARY                 # Default routing for this WBS-A code
  - SECONDARY               # Alternative; documents but not the default
  - CONDITIONAL             # Applies only if `condition` text triggers; surfaces as alternative

# Used in WBS_FERC_Linkage to disambiguate the same code across branches.
# Electric branches use E.* prefix; gas branches use G.* prefix per ADR-16.
branch_context:
  # Electric branches (Part 101 scope)
  - T_SUB                   # E.T.SUB.* (electric transmission substation)
  - T_LIN                   # E.T.LIN.* (electric transmission line)
  - D_SUB                   # E.D.SUB.* (electric distribution substation)
  - D_LIN                   # E.D.LIN.* (electric distribution line)
  - ALL_T                   # E.T.* (any electric T branch)
  - ALL_D                   # E.D.* (any electric D branch)
  # Gas branches (Part 201 scope) — NEW v4 per ADR-16
  - G_TPIPE                 # G.T.PIPE.* (gas transmission pipeline / mains)
  - G_TCS                   # G.T.CS.*   (gas transmission compressor station)
  - G_TSTG                  # G.T.STG.*  (gas transmission storage — underground / LNG)
  - G_DMAIN                 # G.D.MAIN.* (gas distribution main)
  - G_DSVC                  # G.D.SVC.*  (gas distribution service / meter / regulator)
  - G_DSTN                  # G.D.STN.*  (gas distribution city gate / industrial M&R)
  - ALL_G_T                 # G.T.* (any gas T branch)
  - ALL_G_D                 # G.D.* (any gas D branch)
  - ALL                     # Cross-branch (rare)

# ============================================================
# STATE OVERLAY (NEW v4 — 5th matrix dimension per ADR-17)
# Every WBS_FERC_Linkage row + every estimate row may carry a state_overlay
# tag identifying which jurisdictional overlay applies. FEDERAL_ONLY means
# federal canon (Part 101/Part 201) applies without state-overlay modification.
# Authority: NY PSC 16 NYCRR + adjacent NE state PUCs. NY canonical;
# NJ/CT/MA/PA/ME/VT/NH/RI adjacent per ferc-accounting-brief.
# ============================================================
state_overlay:
  - NY_PSC                  # New York Public Service Commission (16 NYCRR) — canonical
  - NJ_BPU                  # New Jersey Board of Public Utilities
  - PA_PUC                  # Pennsylvania Public Utility Commission (Title 66)
  - CT_PURA                 # Connecticut Public Utilities Regulatory Authority
  - MA_DPU                  # Massachusetts Department of Public Utilities
  - ME_PUC                  # Maine Public Utilities Commission
  - VT_PUC                  # Vermont Public Utility Commission
  - NH_PUC                  # New Hampshire Public Utilities Commission
  - RI_PUC                  # Rhode Island Public Utilities Commission
  - FEDERAL_ONLY            # No state overlay applies (federal Form 1/Form 2 only)
  - UNKNOWN

# ============================================================
# RTO/ISO SETTLEMENT (NEW v4 per ADR-18)
# Used in settlement view (third accounting view) to map RTO/ISO charges
# and credits to FERC accounts (456 / 557 / 565) at monthly close.
# Northeast scope: NYISO (NY only) + ISO-NE (MA/CT/RI/VT/ME/NH) + PJM (NJ/PA).
# ============================================================
rto_iso:
  - NYISO                   # New York Independent System Operator
  - ISO_NE                  # ISO New England
  - PJM                     # PJM Interconnection (NJ, PA, plus mid-Atlantic)
  - NONE                    # Utility not in an RTO/ISO footprint
  - UNKNOWN

# ============================================================
# ACCOUNTING VIEW (NEW v4 — three-view per ADR-08 expansion + ADR-18)
# Same template data serves three downstream consumers:
#   ESTIMATING       — Class 5→1 estimate construction (ADR-08 estimating view)
#   CAPITALIZATION   — Plant-account booking at in-service (ADR-08 capitalization view)
#   SETTLEMENT       — Monthly RTO/ISO + state-overlay reconciliation (NEW v4)
