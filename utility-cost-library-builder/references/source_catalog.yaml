# ============================================================
# PRIORITIZATION RULES
# ============================================================
prioritization:
  - "Higher tier wins on overlap (T1 > T2 > T3 > T4 > T5)."
  - "Conflicts → emit BOTH rows + decision_trace recording the discrepancy."
  - "T5 alone NEVER reaches HIGH/MEDIUM confidence."
  - "Geography-specific T1 beats national T2 for that geography."
  - "License: PUBLIC > PUBLIC_WITH_ATTRIBUTION > RESTRICTED; RESTRICTED never embedded."
  - "FERC USoA (18 CFR Part 101) is non-negotiable canonical for ferc_account fields."
  - "For permit bucket A1 (federal): T1 federal regulation always wins."
  - "For permit bucket A2 (state): T1 state regulation always wins."
  - "For permit bucket A4/A5 (asset/activity-specific): use the issuing authority's published procedure (often T1 or T4)."

# ============================================================
# CITATION CONTRACT
# ============================================================
citation_required_fields:
  - source_id
  - tier                             # T1..T5
  - title
  - publisher
  - url_or_doc_id
  - access_date_iso                  # ISO 8601 date
  - vintage_iso                      # source publication date
  - license                          # ∈ enums.license
  - geography_scope
  - notes

# ============================================================
# OUT OF BOUNDS — sources that may NOT be used
# ============================================================
out_of_bounds:
  - "Paywalled content without verified license"
  - "Login-required content (without explicit access permission)"
  - "Marketing pages (contractor SEO, vendor brochures with pricing)"
  - "ToS-violating scraped pages"
  - "Aggregators (PrivCo-style, ZoomInfo, Crunchbase commercial-tier) without primary citation"
  - "AI-generated content as primary basis"
  - "Vendor pricing brochures (scope language only is OK; never pricing)"
