router_version: "1.0.0"
skill_id: create-envelope
supported_contract_version: "1.0.0"

# ----------------------------------------------------------------------------
# GOVERNANCE (master-router tier-3 anchor for this skill)
# ----------------------------------------------------------------------------
governance:
  comment: >-
    create-envelope is a single-route SKILL-class artifact deployed at TIER_3.
    Sibling NORTH_STAR.md carries the intent_brief per master-router
    tier_definitions.TIER_3. This skill produces no SKILL/COMMAND outputs;
    its outputs are <basename>.envelope.yaml sidecars only. Tier inheritance
    therefore does not apply to outputs.
  tier_locked: TIER_3
  tier_authority: "C:/Users/rtoth/.cursor/commands/master-router/COMMAND.md"
  master_router_classification_for_this_installed_skill_md:
    request_type_dispatch_enum: SKILL
    tier_definitions_cite:
      artifact: COMMAND.md tier_definitions.TIER_3
      tier_locked_here: "{ intent_anchor_required: true, intent_brief_required: true, intent_brief_format: standalone_north_star_md_file, north_star_md_required: true }"
      north_star_md_required_section_keys_ordered:
        - context
        - principles
        - boundaries_with_rationale
        - key_concepts_glossary
        - failure_modes
        - upstream_inheritance
        - decision_log_pointer
  package_intent_anchor:
    purpose: >-
      Provide the single deterministic primitive for emitting PDKOS envelope
      sidecars under C:\dev. Replace per-caller guessing with one registry-
      driven contract.
    non_scope:
      - authoring_governed_files
      - updating_existing_sidecars
      - registering_new_subtypes
      - validating_corpus
      - inferring_doc_class_from_filename
    success_criterion: >-
      Any future agent or skill can emit a valid PDKOS sidecar for any
      governed file under C:\dev by calling this skill with (governed_file_
      path, doc_class, parent_envelope_id) and receives a deterministic
      <basename>.envelope.yaml back, with the new envelope's id returned.
  north_star_md:
    path: NORTH_STAR.md
    required_sections:
      - context
      - principles
      - boundaries_with_rationale
      - key_concepts_glossary
      - failure_modes
      - upstream_inheritance
      - decision_log_pointer
  produced_artifact_tier_defaults:
    SIDECAR_ENVELOPE:
      comment: >-
        Sidecar envelopes are the only output. They carry no master-router
        tier metadata (tier is a property of the package, not the sidecar).
      default: null
      downgrade_forbidden: false
      hard_lock_rationale: not_applicable_sidecars_have_no_tier
  decision_trace_persisted: true

# ----------------------------------------------------------------------------
# PACKAGE LAYOUT
# ----------------------------------------------------------------------------
package_layout:
  comment: >-
    Single-route variant of the create-capability layered shape. L1 SKILL.md
    + NORTH_STAR.md, L2 this ROUTER.yaml, L3 references/emit-envelope.md,
    L4 contracts/emit-envelope.yaml. Every file has a sibling .envelope.yaml
    sidecar (eats own dog food).
  layers:
    - id: L1_contract_surface
      file: SKILL.md
      required: true
      role: Cursor-loadable skill contract; identity, mission, scope, activation.
    - id: L1_intent_brief
      file: NORTH_STAR.md
      required: true
      role: TIER_3 standalone intent brief.
    - id: L2_router
      file: ROUTER.yaml
      required: true
      role: This file. Single-route dispatch + governance anchors.
    - id: L3_reference
      file: references/emit-envelope.md
      required: true
      role: Step-by-step emission recipe (human/agent prose).
    - id: L4_contract
      file: contracts/emit-envelope.yaml
      required: true
      role: Closed-world deterministic emission contract with gates.

# ----------------------------------------------------------------------------
# DISPATCH (single-route)
# ----------------------------------------------------------------------------
dispatch:
  routes:
    - id: R-EE010_EMIT_ENVELOPE
      lane: EMIT
      request_type: SIDECAR_ENVELOPE
      reference_path: references/emit-envelope.md
      contract_path: contracts/emit-envelope.yaml
      inputs_required:
        - governed_file_path
        - doc_class
        - parent_envelope_id
      inputs_optional:
        - title_override
        - purpose_override
        - extra_payload_keys
        - overwrite_explicit_paths
      outputs:
        - sidecar_envelope_id
        - sidecar_envelope_path
      gates_applied:
        - naming_gate
        - overwrite_gate
        - path_gate
        - registry_resolve_gate
        - parent_subtype_gate
        - emission_validation_gate

out_of_scope_request_types:
  RULE: "C:/Users/rtoth/.cursor/skills/create-rule/SKILL.md"
  SUBAGENT: "C:/Users/rtoth/.cursor/skills/create-subagent/SKILL.md"
  HOOK: "C:/Users/rtoth/.cursor/skills/create-hook/SKILL.md"
  SKILL: "C:/Users/rtoth/.cursor/skills/create-capability/SKILL.md"
  COMMAND: "C:/Users/rtoth/.cursor/skills/create-capability/SKILL.md"

