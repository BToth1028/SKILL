decisions:
  - id: "D-001"
    session_origin: "260401-1430"
    domain: "architecture"
    outcome: "Centralize all color resolution through a single ResolveThemeColor function."
    rationale: |
      Previously, theme colors were resolved inline at each call site
      using direct dictionary lookups. This caused inconsistencies when
      the theme dictionary structure changed — some call sites would
      break while others worked. Centralizing into one function means
      the lookup logic exists in exactly one place. Alternatives
      considered: (1) a class-based approach with a ThemeResolver
      object — rejected because VBA class overhead is high and the
      function is called hundreds of times per form build; (2) keeping
      inline lookups with a helper — rejected because it still allows
      call sites to bypass the helper.
    supersedes: null

  - id: "D-002"
    session_origin: "260401-1430"
    domain: "naming"
    outcome: "Use 'Theme' prefix for all theme-related modules, 'Resolve' for lookup functions."
    rationale: |
      Consistent naming makes it possible to find all theme code via
      prefix search. 'Resolve' was chosen over 'Get' because the
      function does fallback logic (check override → check form theme
      → check default), not a simple property access.
    supersedes: null

  - id: "D-003"
    session_origin: "260402-2145"
    domain: "architecture"
    outcome: "Store control-level theme overrides in the control's Tag property as YAML fragments."
    rationale: |
      Access controls have a Tag property (string, unlimited length)
      that is unused by the system. Alternatives: (1) a separate
      lookup table mapping control names to overrides — rejected
      because it introduces a sync problem (rename a control and
      the override is orphaned); (2) custom properties via the
      Properties collection — rejected because custom properties
      don't survive copy-paste of controls between forms. The Tag
      property travels with the control through all operations.
    supersedes: null

