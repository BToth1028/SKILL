project:
  name: "ontology-tutor"
  summary: >
    Deterministic Cowork/Cursor skill for TypeDB-grounded ontology engineering.
    The monolithic SKILL.md (636 lines, v1.3.7) was split into a two-file
    architecture: CONTRACT.yaml (all deterministic definitions — enums, gates,
    schemas, error codes, invariants, §-pointer legend) and SKILL.md (all
    procedures, narratives, rationale with §-pointer references). Both files
    passed a full 8-layer workflow audit (Tier A, 94.2 overall), a dry-run
    live-fire test, and targeted fixes for 1 MAJOR + 4 ADVISORY findings.
    The skill is production-ready pending real-world usage.
  scope: >
    Two-file skill architecture (CONTRACT.yaml + SKILL.md), ROUTER.yaml
    machine contract, evidence pipeline (Sources 1-3 + Source 9 hard gate),
    Mode 1 (Pure TypeDB) and Mode 2 (TypeDB Embodiment using SQL) pipelines,
    18 validation gates, 14 anti-drift invariants, 13 error codes, field
    value governance with operator_decision workflow.
  non_scope: >
    Runtime axiom enforcement (planned companion skills: ontology-axiom-spec,
    ontology-axiom-compliance). SQL tuning unrelated to model design.
    OS-level file operations. Live TypeDB RPC during tutor sessions.

