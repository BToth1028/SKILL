decisions:
  - id: D-001
    session_origin: "260511-1430"
    domain: "architecture"
    outcome: "Split monolithic SKILL.md into CONTRACT.yaml (definitions) + SKILL.md (procedures)."
    rationale: >
      The monolithic file was 636 lines with definitions and procedures
      interleaved. Splitting allows: (1) deterministic definitions to be
      machine-parseable YAML, (2) procedures to reference definitions via
      §-pointers without restating them, (3) zero-restatement rule — SKILL.md
      never lists enum values, gate names, or error codes inline.
    supersedes: null

  - id: D-002
    session_origin: "260511-1430"
    domain: "naming"
    outcome: "Use §-pointer convention: § + mnemonic letter (26 total, A-Z plus §1)."
    rationale: >
      Each pointer maps to exactly one section in CONTRACT.yaml via the
      pointer_legend. Letters are mnemonic: §A = authority_source, §C =
      classification_values, §G = gates, etc. §1 is used for
      input_boundary (max_candidates_per_invocation) because all letters
      were consumed.
    supersedes: null

  - id: D-003
    session_origin: "260511-1430"
    domain: "field_governance"
    outcome: "Added cursory_semantic_review_criteria with three deterministic predicates."
    rationale: >
      Audit finding F-L1-001 (MAJOR) identified that Mode 2 step 3 said
      "perform a cursory semantic review" without defining what that means.
      Two agents could produce different results. Fix: three closed
      predicates — recommend_keep (ANY-of 3 conditions), recommend_remove
      (ALL-of 3 conditions), uncertain (fallback). This makes the review
      deterministic and auditable.
    supersedes: null

  - id: D-004
    session_origin: "260511-1430"
    domain: "activation"
    outcome: "Added MCP pre-flight check as activation step 4 (renumbered subsequent steps)."
    rationale: >
      Advisory finding F-L7-001: the skill assumed MCP tools were reachable
      but never verified before entering the evidence pipeline. Adding a
      pre-flight check prevents silent failures when Qdrant or snapshot
      MCP servers are unreachable.
    supersedes: null

  - id: D-005
    session_origin: "260511-1430"
    domain: "evidence_pipeline"
    outcome: "Tightened Mode 1 step 2 from 'identify the closest TypeDB reference pattern' to a closed-list match with citeability requirement."
    rationale: >
      Advisory finding F-L1-002: original wording was ambiguous — 'closest'
      is subjective. Fix specifies the exact closed list of patterns and
      requires at least one citeable Source 1 chunk supporting the match.
    supersedes: null

  - id: D-006
    session_origin: "260511-1430"
    domain: "evidence_sufficiency"
    outcome: "Added es_state tracker template before Evidence Sufficiency A-F execution."
    rationale: >
      Advisory finding F-L7-002: the agent must track 6+ concurrent state
      items across evidence sufficiency rounds. The es_state object
      (question_type, min_units, units_achieved, round_index, saturated,
      contradiction, adversarial_run) reduces cognitive load by
      consolidating all tracking into one mutable structure.
    supersedes: null

  - id: D-007
    session_origin: "260511-1430"
    domain: "input_validation"
    outcome: "Added input_boundary section: max_candidates_per_invocation = 20, one_table_per_invocation = true."
    rationale: >
      Advisory finding F-L4-001: no upper bound on input size. Without a
      cap, an operator could submit 100 candidates and overwhelm the
      evidence pipeline. 20 is a practical ceiling that keeps retrieval
      manageable while supporting real-world batch sizes.
    supersedes: null

  - id: D-008
    session_origin: "260511-1430"
    domain: "activation"
    outcome: "SKILL.md activation step 2 reads CONTRACT.yaml; step 3 reads ROUTER.yaml."
    rationale: >
      In the two-file architecture, CONTRACT.yaml must be loaded before
      any evidence pipeline runs because it defines the enums, gates,
      and procedures the pipeline depends on. ROUTER.yaml is read next
      for deployment bindings.
    supersedes: null

  - id: D-009
    session_origin: "260511-1430"
    domain: "architecture"
    outcome: "Zero-restatement rule: SKILL.md never lists enum values, gate names, error codes inline."
    rationale: >
      Restating definitions in two files creates maintenance risk — they
      will diverge. SKILL.md defers to CONTRACT.yaml via §-pointers for
      all definitions. The only place a definition exists is CONTRACT.yaml.
    supersedes: null

  - id: D-010
    session_origin: "260511-1430"
    domain: "evidence_pipeline"
    outcome: "Sources 2 and 3 are refresh inputs only — must flow through Source 1 before grounding decisions."
    rationale: >
      This is invariant 11. Allowing direct use of Source 2 or Source 3
      for design decisions would bypass the vector corpus and produce
      decisions that cannot be traced back to Source 1 citations. The
      refresh loop ensures all evidence enters through the same gate.
    supersedes: null

  - id: D-011
    session_origin: "260511-1430"
    domain: "testing"
    outcome: "Dry-run test validated pipeline structure, §-pointer resolution, and output contract compliance."
    rationale: >
      A dry-run (simulated evidence, no live MCP) was chosen over a
      live-fire test because the MCP servers may not be available in
      every session. The dry-run confirms the skill's structural
      correctness; live validation is deferred to T-002.
    supersedes: null

  - id: D-012
    session_origin: "260511-1430"
    domain: "file_management"
    outcome: "Archive stale files in _ar/ directory; retain SKILL.md.bak-pre-split as backup."
    rationale: >
      The original monolithic SKILL.md is preserved as SKILL.md.bak-pre-split
      (or .bak-pre-split.orig due to filesystem ghost-state) for disaster
      recovery. Session artifacts (logic tree, alignment doc, .skill file)
      are archived in _ar/ and excluded from skill execution per the
      corpus_archive_policy.
    supersedes: null

